{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperación enviada - Las Acacias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root{--verde:#1f6b45;--fondo:#eef3ef;--borde:#dfe8e2}
        body{min-height:100vh;background:var(--fondo);font-family:"Segoe UI",Arial,sans-serif;display:flex;align-items:center}
        .box{background:#fff;border:1px solid var(--borde);border-radius:22px;box-shadow:0 18px 50px rgba(31,107,69,.12)}
        .logo{height:64px}.brand{color:var(--verde);font-weight:750}.icon{font-size:2.5rem}
        .btn-success{background:var(--verde);border-color:var(--verde);border-radius:12px}
    </style>
</head>
<body>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="box p-4 p-md-5 text-center">
                <img src="{% static 'core/img/las_acacias_logo.png' %}" class="logo mb-3" alt="Las Acacias">
                <div class="icon mb-2">✉️</div>
                <h1 class="h3 fw-bold mb-3">Revisá tu correo</h1>
                <p class="text-secondary mb-4">
                    Si el lote tiene un correo registrado, recibirás las instrucciones para recuperar el acceso.
                </p>
                <a href="{% url 'home' %}" class="btn btn-success px-4">
                    Volver al ingreso
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
