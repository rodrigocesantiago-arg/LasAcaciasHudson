{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar acceso - Las Acacias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root{--verde:#1f6b45;--verde-oscuro:#155236;--fondo:#eef3ef;--borde:#dfe8e2;--muted:#6d7b73}
        body{min-height:100vh;background:var(--fondo);font-family:"Segoe UI",Arial,sans-serif;display:flex;align-items:center}
        .card-reset{background:#fff;border:1px solid var(--borde);border-radius:22px;box-shadow:0 18px 50px rgba(31,107,69,.12)}
        .logo{height:64px}.brand{color:var(--verde);font-weight:750}.muted{color:var(--muted)}
        .form-control{border-radius:12px;padding:.78rem .9rem}
        .form-control:focus{border-color:var(--verde);box-shadow:0 0 0 .2rem rgba(31,107,69,.12)}
        .btn-success{background:var(--verde);border-color:var(--verde);border-radius:12px;padding:.78rem;font-weight:650}
        .btn-success:hover{background:var(--verde-oscuro);border-color:var(--verde-oscuro)}
        a{color:var(--verde)}
    </style>
</head>
<body>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card-reset p-4 p-md-5">

                <div class="d-flex align-items-center gap-3 mb-4">
                    <img src="{% static 'core/img/las_acacias_logo.png' %}" class="logo" alt="Las Acacias">
                    <div>
                        <div class="brand fs-4">Las Acacias</div>
                        <div class="muted small">Comunidad360</div>
                    </div>
                </div>

                <h1 class="h3 fw-bold mb-2">Recuperar contraseña</h1>
                <p class="text-secondary mb-4">
                    Ingresá tu número de lote. Si tiene un correo registrado, enviaremos allí las instrucciones para recuperar el acceso.
                </p>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label for="numero_lote" class="form-label fw-semibold">Número de lote</label>
                        <input id="numero_lote" type="text" name="numero_lote"
                               class="form-control" placeholder="Ej: 65"
                               inputmode="numeric" required autofocus>
                    </div>

                    <button class="btn btn-success w-100" type="submit">
                        Enviar instrucciones
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'home' %}" class="text-decoration-none fw-semibold">
                        Volver al ingreso
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
