{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comunidad360</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'core/css/styles.css' %}"
    >

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-lg p-4">

                <h1 class="text-center text-success mb-3">
                    🏡 Comunidad360
                </h1>

                <h4 class="text-center text-secondary mb-4">
                    Las Acacias Hudson
                </h4>

                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST" action="{% url 'login' %}">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Número de lote
                        </label>

                        <input
                            type="text"
                            name="numero_lote"
                            class="form-control"
                            placeholder="Ej: 65"
                            required
                        >

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success w-100"
                    >
                        Ingresar
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
