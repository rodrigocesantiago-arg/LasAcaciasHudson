services:
  postgres:
    image: postgres:16
    container_name: comunidad360-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: comunidad360
      POSTGRES_USER: comunidad360
      POSTGRES_PASSWORD: comunidad360

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: comunidad360-backend

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    depends_on:
      - postgres

volumes:
  postgres_data: